<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d1016;--p:#161b24;--r:#1f2632;--h:rgba(255,255,255,.07);--t:#eef1f6;--m:#8b94a5;--a:#5aa9ff;--g:#3ddc97;--y:#f4c35f;--e:#ff6b6b;--sb:env(safe-area-inset-bottom,0px)}
body.light{--bg:#f1f3f8;--p:#fff;--r:#e9edf5;--h:rgba(15,23,42,.09);--t:#111827;--m:#5d6778;--a:#1d7fe0;--y:#b9770e}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + var(--sb))}
button,input,select{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
.app{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
h2{font-size:13px;color:var(--m);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pill{padding:5px 11px;border-radius:99px;background:var(--r);font-size:12px;color:var(--m)}
.pill.on{color:var(--g)}.pill.off{color:var(--e)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--p);border:1px solid var(--h);border-radius:16px;padding:14px}
.big{font-size:24px;font-weight:800;margin-top:2px}
.lbl{font-size:12px;color:var(--m)}
.card{background:var(--p);border:1px solid var(--h);border-radius:16px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.col{flex:1;min-width:0}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--m);margin-top:2px;word-break:break-word}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--r)}
.s-done,.s-approved,.s-active{color:var(--g)}.s-pending,.s-processing,.s-reserved{color:var(--y)}.s-rejected,.s-failed{color:var(--e)}.s-sold{color:var(--a)}
.btn{padding:10px 14px;border-radius:12px;background:var(--a);color:#fff;font-weight:700}
.btn.g{background:var(--g);color:#06281a}.btn.e{background:var(--e);color:#fff}.btn.n{background:var(--r);color:var(--t)}
.btn.s{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.acts{display:flex;gap:8px;margin-top:10px}.acts .btn{flex:1}
input,select{width:100%;padding:12px 13px;border-radius:12px;background:var(--r);border:1px solid var(--h);margin-bottom:8px}
input:focus{outline:2px solid var(--a)}
.img{width:56px;height:56px;border-radius:14px;object-fit:cover;background:var(--r);flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:99px;background:var(--r);white-space:nowrap;font-size:13px;font-weight:600;color:var(--m)}
.chip.on{background:var(--a);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--p);border-top:1px solid var(--h);padding:6px 6px calc(6px + var(--sb));z-index:10}
nav button{flex:1;min-width:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--m);position:relative}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--a)}
nav b{position:absolute;top:0;right:22%;background:var(--e);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.empty{text-align:center;color:var(--m);padding:30px 0}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-90px);background:var(--p);border:1px solid var(--h);padding:10px 16px;border-radius:12px;z-index:30;transition:.25s;max-width:90%;font-size:14px}
.toast.show{transform:translateX(-50%)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--p);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + var(--sb));max-height:88vh;overflow:auto}
.md h3{margin-bottom:10px}.md label{font-size:12px;color:var(--m);display:block;margin:2px 2px 4px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
button.card{display:block;color:inherit}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1 id="title">Admin</h1><span class="pill" id="state">…</span></div>
  <div id="view"></div>
</div>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
var tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("secondary_bg_color")}catch(e){}
 if(tg.colorScheme==="light")document.body.classList.add("light")}
var $=function(s){return document.querySelector(s)};
var E=function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var F=function(n){return Number(n||0).toLocaleString("ru-RU",{maximumFractionDigits:0})};
var NF=[],tab="home",ofilter="pending",pending=0,busy=false;
var TABS=[["home","📊","Bosh"],["orders","📦","Buyurtma"],["nft","🖼","NFT"],["uc","🎮","UC"],["users","👥","Users"],["smm","🚀","SMM"],["set","⚙️","Sozlama"]];
var TYPES={buy:"⭐ Stars",post_stars:"📝 Post",gift:"🎁 Gift",topup:"💳 Hisob",nft:"🖼 NFT",uc:"🎮 UC"};
var ERR={bad_url:"Havola noto'g'ri (t.me/nft/Nom-123)",bad_price:"Narx noto'g'ri",duplicate:"Bu NFT allaqachon qo'shilgan",not_active:"Faqat sotuvdagi NFT o'chiriladi",insufficient:"Hisobda yetarli mablag' yo'q",bad_request:"Noto'g'ri so'rov",order_not_found:"Buyurtma topilmadi",already_processed:"Allaqachon ko'rib chiqilgan",server:"Serverda xatolik",network:"Internet bilan aloqa yo'q",auth:"Ruxsat yo'q: mini-appni botdagi tugma orqali oching",not_found:"Topilmadi",bad_uc:"UC miqdori noto'g'ri",bad_lookup_url:"Manzil http(s):// bilan boshlansin va {id} bo'lsin",bad_pubg_id:"PUBG ID noto'g'ri"};

function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show")},2800);if(tg&&tg.HapticFeedback)try{tg.HapticFeedback.impactOccurred("light")}catch(e){}}
function api(p,o){o=o||{};o.headers={"X-Telegram-Init-Data":tg?tg.initData:"","Content-Type":"application/json"};o.cache="no-store";
 return fetch(p,o).then(function(r){return r.json().catch(function(){return{ok:false,error:"server"}}).then(function(d){if(r.status===401)d.error="auth";return d})}).catch(function(){return{ok:false,error:"network"}})}
function post(p,b){return api(p,{method:"POST",body:JSON.stringify(b||{})})}
function errText(d){return (ERR[d.reason]||ERR[d.error]||d.reason||d.error||"Xato")+(d.detail?" ("+d.detail+")":"")}
function modal(title,fields,ok,onSave){var o=document.createElement("div");o.className="ov";
 var h='<div class="md"><h3>'+E(title)+"</h3>"+fields.map(function(f,i){return"<label>"+E(f.l)+'</label><input data-i="'+i+'" value="'+E(f.v)+'" inputmode="'+(f.m||"text")+'" autocapitalize="off">'}).join("")+'<div class="acts"><button class="btn n" data-x>Bekor</button><button class="btn g" data-s>'+E(ok||"Saqlash")+"</button></div></div>";
 o.innerHTML=h;document.body.appendChild(o);var close=function(){o.remove()};
 o.onclick=function(e){if(e.target===o)close()};o.querySelector("[data-x]").onclick=close;
 o.querySelector("[data-s]").onclick=function(){var vals={};[].forEach.call(o.querySelectorAll("input"),function(i){vals[fields[i.dataset.i].k]=i.value.trim()});var b=this;b.disabled=true;Promise.resolve(onSave(vals)).then(function(keep){b.disabled=false;if(!keep)close()})}}
function ask(q,cb){if(tg&&tg.showConfirm)tg.showConfirm(q,function(ok){if(ok)cb()});else if(confirm(q))cb()}

function nav(){$("#nav").innerHTML=TABS.map(function(t){return'<button data-t="'+t[0]+'" class="'+(t[0]===tab?"on":"")+'"><i>'+t[1]+"</i>"+t[2]+(t[0]==="orders"&&pending?"<b>"+pending+"</b>":"")+"</button>"}).join("");
 [].forEach.call(document.querySelectorAll("nav button"),function(b){b.onclick=function(){tab=b.dataset.t;render()}})}
function loading(){$("#view").innerHTML='<div class="empty">Yuklanmoqda…</div>'}
function authFail(){$("#view").innerHTML='<div class="empty">🔒 Ruxsat yo\'q.<br>Bu sahifa faqat adminlar uchun va Telegram ichida ochiladi.</div>'}

function render(){nav();$("#title").textContent=TABS.filter(function(t){return t[0]===tab})[0][2];loading();({home:home,orders:orders,nft:nfts,uc:uc,users:users,smm:smm,set:settings})[tab]()}

function home(){api("/api/adm/overview").then(function(d){
 if(d.error==="auth")return authFail();if(!d.ok)return $("#view").innerHTML='<div class="empty">Yuklab bo\'lmadi</div>';
 pending=d.pending;nav();var st=$("#state");st.textContent=d.bot_active?"● Bot ON":"● Bot OFF";st.className="pill "+(d.bot_active?"on":"off");
 var n=d.nft||{};
 $("#view").innerHTML='<div class="grid">'+
 box("Kunlik ⭐",F(d.daily.sold_stars),F(d.daily.sold_sum)+" so'm")+box("Haftalik ⭐",F(d.weekly.sold_stars),F(d.weekly.sold_sum)+" so'm")+
 box("Oylik ⭐",F(d.monthly.sold_stars),F(d.monthly.sold_sum)+" so'm")+box("Foydalanuvchi",F(d.users),"")+
 box("Kutilayotgan",F(d.pending),"buyurtma")+box("NFT sotuvda",F(n.active||0),"band: "+F(n.reserved||0)+" · sotilgan: "+F(n.sold||0))+
 box("Post stars",F(d.post_done.s),F(d.post_done.c)+" ta buyurtma")+box("NFT daromad",F(d.nft_sold.s),"so'm · "+F(d.nft_sold.c)+" ta")+box("UC daromad",F((d.uc_done||{}).s),"so'm · "+F((d.uc_done||{}).c)+" ta")+
 '</div><h2>Akkauntlar</h2><div class="card row sp"><div><div class="nm">Ulangan akkauntlar</div><div class="sub">Faol: '+d.accounts.active+" / "+d.accounts.total+'</div></div><button class="btn n s" id="accs">Tekshirish</button></div><div id="accout"></div>'
 $("#accs").onclick=accounts})}
function box(l,v,s){return'<div class="box"><div class="lbl">'+l+'</div><div class="big">'+v+'</div><div class="lbl">'+s+"</div></div>"}
function accounts(){$("#accout").innerHTML='<div class="empty">…</div>';api("/api/adm/accounts").then(function(d){
 if(!d.ok||!d.accounts.length){$("#accout").innerHTML='<div class="empty">Akkaunt ulanmagan</div>';return}
 $("#accout").innerHTML=d.accounts.map(function(a){return'<div class="card row sp"><div class="col"><div class="nm">#'+a.id+" "+E(a.title)+'</div><div class="sub" id="at'+a.id+'">'+E(a.status)+'</div></div><button class="btn s n" data-a="'+a.id+'">Test</button></div>'}).join("");
 [].forEach.call(document.querySelectorAll("[data-a]"),function(b){b.onclick=function(){var el=$("#at"+b.dataset.a);el.textContent="Tekshirilmoqda…";post("/api/adm/accounts/"+b.dataset.a+"/test").then(function(r){el.textContent=(r.ok?"✅ ":"❌ ")+(r.message||"")})}})})}

function orders(){var fs=[["pending","Kutilmoqda"],["","Hammasi"],["done","Bajarilgan"],["failed","Xato"],["rejected","Rad"]];
 api("/api/adm/orders?status="+ofilter).then(function(d){
 if(d.error==="auth")return authFail();var rows=d.orders||[];
 var h='<div class="chips">'+fs.map(function(f){return'<button class="chip '+(f[0]===ofilter?"on":"")+'" data-f="'+f[0]+'">'+f[1]+"</button>"}).join("")+"</div>";
 if(!rows.length)h+='<div class="empty">Buyurtma yo\'q</div>';
 h+=rows.map(function(o){var wait=o.status==="pending"||o.status==="processing";
  var money=o.price_amount?F(o.price_amount)+" so'm":"",stars=o.stars_amount?F(o.stars_amount)+" ⭐":"";
  return'<div class="card"><div class="row sp"><div class="nm">#'+o.id+" "+(TYPES[o.type]||E(o.type))+'</div><span class="tag s-'+E(o.status)+'">'+E(o.status)+"</span></div>"+
  '<div class="sub">👤 <code>'+o.user_id+"</code> · "+[stars,money].filter(Boolean).join(" · ")+"</div>"+(o.note?'<div class="sub">'+E(o.note)+"</div>":"")+
  '<div class="sub">'+E((o.created_at||"").replace("T"," ").slice(0,16))+"</div>"+
  (wait?'<div class="acts"><button class="btn g" data-ok="'+o.id+'">✅ Tasdiqlash</button><button class="btn e" data-no="'+o.id+'">❌ Rad</button></div>':"")+"</div>"}).join("");
 $("#view").innerHTML=h;
 [].forEach.call(document.querySelectorAll("[data-f]"),function(b){b.onclick=function(){ofilter=b.dataset.f;render()}});
 [].forEach.call(document.querySelectorAll("[data-ok]"),function(b){b.onclick=function(){decide(b.dataset.ok,"approve",b)}});
 [].forEach.call(document.querySelectorAll("[data-no]"),function(b){b.onclick=function(){ask("Buyurtma #"+b.dataset.no+" rad etilsinmi?",function(){decide(b.dataset.no,"reject",b)})}})})}
function decide(id,act,btn){if(busy)return;busy=true;btn.disabled=true;toast("Bajarilmoqda…");
 post("/api/adm/orders/"+id+"/"+act).then(function(r){busy=false;toast(r.ok?"✅ Tayyor":"❌ "+errText(r));render()})}

function nfts(){api("/api/adm/nfts").then(function(d){
 if(d.error==="auth")return authFail();var rows=d.items||[];NF=rows;
 var h='<div class="card"><div class="lbl" style="margin-bottom:8px">Yangi NFT qo\'shish</div><input id="nu" placeholder="https://t.me/nft/PlushPepe-1234" inputmode="url" autocapitalize="off"><input id="np" placeholder="Narx (so\'m)" inputmode="numeric"><div id="pv"></div><div class="acts"><button class="btn n" id="pvb">👁 Ko\'rish</button><button class="btn g" id="nadd">➕ Qo\'shish</button></div></div>';
 h+="<h2>Katalog ("+rows.length+")</h2>";if(!rows.length)h+='<div class="empty">NFT yo\'q</div>';
 h+=rows.map(function(n){var tr=[n.model,n.backdrop,n.symbol].filter(Boolean).join(" · ");
  return'<div class="card"><div class="row"><img class="img" loading="lazy" src="'+E(n.image)+'" alt="" onerror="this.style.visibility=\'hidden\'"><div class="col"><div class="nm">'+E(n.name)+" #"+n.number+'</div><div class="sub">'+E(tr)+'</div><div class="sub"><b style="color:var(--y)">'+F(n.price)+" so'm</b> · <span class=\"s-"+E(n.status)+'">'+E(n.status)+"</span></div></div></div>"+
  '<div class="acts"><button class="btn n s" data-ed="'+n.id+'">✏️ Tahrirlash</button>'+(n.status==="active"?'<button class="btn e s" data-nd="'+n.id+'">🗑 O\'chirish</button>':"")+"</div></div>"}).join("");
 $("#view").innerHTML=h;
 $("#pvb").onclick=function(){var u=$("#nu").value.trim();if(!u)return;$("#pv").innerHTML='<div class="sub">Yuklanmoqda…</div>';
  post("/api/adm/nfts/preview",{url:u}).then(function(r){if(!r.ok){$("#pv").innerHTML="";return toast("❌ "+errText(r))}var i=r.info;
   $("#pv").innerHTML='<div class="row" style="margin-bottom:8px"><img class="img" src="'+E(i.image)+'" alt="" onerror="this.style.visibility=\'hidden\'"><div class="col"><div class="nm">'+E(i.name)+" #"+i.number+'</div><div class="sub">'+E([i.model,i.backdrop,i.symbol].filter(Boolean).join(" · ")||"Xususiyatlar topilmadi")+"</div>"+(r.duplicate?'<div class="sub s-failed">Allaqachon qo\'shilgan #'+r.duplicate+"</div>":"")+"</div></div>"})};
 $("#nadd").onclick=function(){var b=this;b.disabled=true;post("/api/adm/nfts",{url:$("#nu").value,price:$("#np").value}).then(function(r){b.disabled=false;if(r.ok){toast("✅ Qo'shildi");render()}else toast("❌ "+errText(r))})};
 [].forEach.call(document.querySelectorAll("[data-ed]"),function(b){b.onclick=function(){var n=NF.filter(function(x){return x.id==b.dataset.ed})[0];if(!n)return;
  modal("NFT #"+n.id+" tahriri",[{k:"price",l:"Narx (so'm)",v:n.price,m:"numeric"},{k:"name",l:"Nomi",v:n.name},{k:"number",l:"Raqami",v:n.number,m:"numeric"},{k:"model",l:"Model",v:n.model},{k:"backdrop",l:"Backdrop",v:n.backdrop},{k:"symbol",l:"Symbol",v:n.symbol},{k:"image",l:"Rasm (https://...)",v:n.image,m:"url"}],"Saqlash",
   function(v){return post("/api/adm/nfts/"+n.id+"/update",v).then(function(r){if(r.ok){toast("✅ Saqlandi");render();return false}toast("❌ "+errText(r));return true})})}});
 [].forEach.call(document.querySelectorAll("[data-nd]"),function(b){b.onclick=function(){ask("NFT o'chirilsinmi?",function(){post("/api/adm/nfts/"+b.dataset.nd+"/delete").then(function(r){toast(r.ok?"🗑 O'chirildi":"❌ "+errText(r));if(r.ok)render()})})}})})}

var uq="";
function users(){$("#view").innerHTML='<input id="uq" placeholder="ID yoki @username qidirish" value="'+E(uq)+'"><div id="ul"><div class="empty">…</div></div>';
 var timer;$("#uq").oninput=function(){uq=this.value;clearTimeout(timer);timer=setTimeout(list,350)};list();
 function list(){api("/api/adm/users?q="+encodeURIComponent(uq)).then(function(d){if(d.error==="auth")return authFail();var r=d.users||[];
  $("#ul").innerHTML=r.length?r.map(function(u){return'<div class="card"><div class="row sp"><div class="col"><div class="nm">'+E(u.first_name||"—")+(u.username?" @"+E(u.username):"")+'</div><div class="sub">ID <code>'+u.id+"</code></div></div></div>"+
   '<div class="sub" style="margin-top:6px">💰 <b>'+F(u.balance_sum)+" so'm</b> · ⭐ <b>"+F(u.balance_stars)+'</b></div><div class="acts"><button class="btn g s" data-u="'+u.id+'" data-d="1">＋ Qo\'shish</button><button class="btn e s" data-u="'+u.id+'" data-d="0">－ Ayirish</button></div></div>'}).join(""):'<div class="empty">Topilmadi</div>';
  [].forEach.call(document.querySelectorAll("[data-u]"),function(b){b.onclick=function(){var add=b.dataset.d==="1";
   modal(add?"Hisobga qo'shish":"Hisobdan ayirish",[{k:"amount",l:"Miqdor (so'm)",v:"",m:"numeric"}],add?"Qo'shish":"Ayirish",function(v){
    return post("/api/adm/users/"+b.dataset.u+"/balance",{amount:v.amount,add:add,kind:"sum"}).then(function(r){if(r.ok){toast("✅ Yangi hisob: "+F(r.balance)+" so'm");list();return false}toast("❌ "+errText(r));return true})})}})})}}

function settings(){api("/api/adm/settings").then(function(d){if(d.error==="auth")return authFail();
 $("#view").innerHTML='<div class="card"><div class="sw"><div><div class="nm">Bot holati</div><div class="sub">O\'chiq bo\'lsa foydalanuvchilar kira olmaydi</div></div><button class="btn '+(d.active?"g":"e")+' s" id="tg">'+(d.active?"ON":"OFF")+"</button></div></div>"+
 '<h2>Narxlar (1 ⭐ = so\'m)</h2><div class="card"><div class="lbl">Stars sotib olish</div><input id="s1" inputmode="decimal" value="'+d.star_price+'"><div class="lbl">Postga stars</div><input id="s2" inputmode="decimal" value="'+d.post_price+'"><div class="lbl">Postga minimal stars</div><input id="s3" inputmode="numeric" value="'+d.post_min_stars+'"><div class="lbl">Foiz (%)</div><input id="s4" inputmode="decimal" value="'+d.percent+'"><div class="lbl">To\'lov kartasi</div><input id="s5" value="'+E(d.card)+'"><button class="btn" id="sv" style="width:100%">💾 Saqlash</button></div>';
 $("#tg").onclick=function(){post("/api/adm/settings",{active:!d.active}).then(function(){toast("✅ Bot holati o'zgardi");render()})};
 $("#sv").onclick=function(){post("/api/adm/settings",{star_price:$("#s1").value,post_price:$("#s2").value,post_min_stars:$("#s3").value,percent:$("#s4").value,card:$("#s5").value}).then(function(r){toast(r.ok?"✅ Saqlandi":"❌ Xato")})}})}

/* ===================== SMM NAKRUTKA ===================== */
var SM={sub:"set",q:"",plat:"",off:0,ofil:"active",cats:null,sel:{},cq:""};
var SMERR={bad_url:"URL http:// yoki https:// bilan boshlansin",bad_number:"Raqam noto'g'ri",provider:"Provayder xatosi",nothing:"Hech narsa o'zgarmadi",already_processed:"Allaqachon yakunlangan",provider_not_configured:"Avval provayder URL va kalitini kiriting"};
function smErr(d){return (SMERR[d.error]||ERR[d.error]||d.error||"Xato")+(d.detail?": "+d.detail:"")}
function smm(){
 var subs=[["set","Sozlama"],["svc","Xizmatlar"],["ord","Buyurtmalar"]];
 var h='<div class="chips">'+subs.map(function(s){return'<button class="chip '+(SM.sub===s[0]||(SM.sub==="imp"&&s[0]==="svc")?"on":"")+'" data-sm="'+s[0]+'">'+s[1]+"</button>"}).join("")+"</div><div id=\"smv\"><div class=\"empty\">Yuklanmoqda…</div></div>";

 var h='<div class="card"><div class="lbl" style="margin-bottom:8px">Yangi paket</div><input id="pu" placeholder="UC miqdori (masalan 660)" inputmode="numeric"><input id="pb" placeholder="Bonus UC (ixtiyoriy)" inputmode="numeric"><input id="pp" placeholder="Narx (so\'m)" inputmode="numeric"><button class="btn g" id="padd" style="width:100%">➕ Qo\'shish</button></div><h2>Paketlar ('+rows.length+")</h2>";
 if(!rows.length)h+='<div class="empty">Paket yo\'q</div>';
 h+=rows.map(function(r){return'<div class="card"><div class="row sp"><div class="col"><div class="nm">'+F(r.uc)+" UC"+(r.bonus?" + "+F(r.bonus)+" bonus":"")+'</div><div class="sub"><b style="color:var(--y)">'+F(r.price)+" so'm</b> · "+(r.uc+r.bonus>0?F(r.price/(r.uc+r.bonus)):0)+' so\'m/UC</div></div><span class="tag s-'+(r.active?"active":"rejected")+'">'+(r.active?"sotuvda":"yashirin")+'</span></div><div class="acts"><button class="btn n s" data-e="'+r.id+'">✏️</button><button class="btn n s" data-t="'+r.id+'" data-a="'+r.active+'">'+(r.active?"Yashirish":"Yoqish")+'</button><button class="btn e s" data-x="'+r.id+'">🗑</button></div></div>'}).join("");
 $("#ucv").innerHTML=h;
 $("#padd").onclick=function(){var b=this;b.disabled=true;post("/api/adm/uc/packages",{uc:$("#pu").value,bonus:$("#pb").value,price:$("#pp").value}).then(function(r){b.disabled=false;if(r.ok){toast("✅ Qo'shildi");ucPk()}else toast("❌ "+ucErr(r))})};
 [].forEach.call(document.querySelectorAll("[data-t]"),function(b){b.onclick=function(){post("/api/adm/uc/packages/"+b.dataset.t+"/update",{active:b.dataset.a!=="1"}).then(function(){ucPk()})}});
 [].forEach.call(document.querySelectorAll("[data-x]"),function(b){b.onclick=function(){ask("Paket o'chirilsinmi? Buyurtmalar tarixi saqlanadi.",function(){post("/api/adm/uc/packages/"+b.dataset.x+"/delete").then(function(r){toast(r.ok?"🗑 O'chirildi":"❌ "+ucErr(r));ucPk()})})}});
 [].forEach.call(document.querySelectorAll("[data-e]"),function(b){b.onclick=function(){var r=UC.pk.filter(function(x){return x.id==b.dataset.e})[0];if(!r)return;
  modal("Paket #"+r.id,[{k:"uc",l:"UC miqdori",v:r.uc,m:"numeric"},{k:"bonus",l:"Bonus UC",v:r.bonus,m:"numeric"},{k:"price",l:"Narx (so'm)",v:r.price,m:"numeric"},{k:"sort",l:"Tartib raqami (kichigi birinchi)",v:r.sort,m:"numeric"}],"Saqlash",
   function(v){return post("/api/adm/uc/packages/"+r.id+"/update",v).then(function(x){if(x.ok){toast("✅ Saqlandi");ucPk();return false}toast("❌ "+ucErr(x));return true})})}})})}
function ucSet(){api("/api/adm/uc/settings").then(function(d){
 if(d.error==="auth")return authFail();var en=d.enabled,rq=d.require_nick;
 $("#ucv").innerHTML='<div class="card"><div class="sw"><div><div class="nm">UC sotuvi</div><div class="sub">O\'chiq bo\'lsa buyurtma qabul qilinmaydi</div></div><button class="btn s '+(en?"g":"e")+'" id="uce">'+(en?"ON":"OFF")+"</button></div></div>"+
 "<h2>Nickname tekshiruvi</h2>"+
 '<div class="card"><div class="sub" style="margin-bottom:8px">PUBG ID bo\'yicha nickname qaytaradigan API manzilini kiriting. ID o\'rniga <code>{id}</code> yozing (kalit kerak bo\'lsa <code>{key}</code> ham mumkin). Javob JSON bo\'lishi kerak.</div>'+
 '<div class="lbl">API manzili</div><input id="ul1" value="'+E(d.lookup_url)+'" placeholder="https://example.com/api/player/{id}" inputmode="url" autocapitalize="off">'+
 '<div class="lbl">JSON ichidagi nickname yo\'li</div><input id="ul2" value="'+E(d.lookup_path)+'" placeholder="data.nickname" autocapitalize="off">'+
 '<div class="lbl">API kaliti '+(d.key_set?"(saqlangan; bo'sh qoldirsangiz o'zgarmaydi)":"(ixtiyoriy)")+'</div><input id="ul3" type="password" autocomplete="off" placeholder="'+(d.key_set?"yangi kalit":"kalit")+'">'+
 '<div class="sw" style="margin:6px 0 12px"><div><div class="nm">Nickname majburiy</div><div class="sub">Tekshirib bo\'lmasa xarid qilib bo\'lmaydi</div></div><button class="btn s '+(rq?"g":"e")+'" id="ucr">'+(rq?"ON":"OFF")+'</button></div>'+
 '<div class="lbl">Sinov: PUBG ID</div><input id="ul4" inputmode="numeric" placeholder="Sinash uchun ID"><div id="ult" class="sub"></div>'+
 '<div class="acts"><button class="btn n" id="ultb">🔌 Sinash</button><button class="btn g" id="ulsv">💾 Saqlash</button></div></div>'+
 '<div class="sub" style="padding:0 4px">Nickname tekshiruvi sozlanmasa ham xarid ishlaydi: mijoz ID ni o\'zi tasdiqlaydi, sizga esa nickname\'siz ariza keladi.</div>';
 $("#uce").onclick=function(){en=!en;this.className="btn s "+(en?"g":"e");this.textContent=en?"ON":"OFF";post("/api/adm/uc/settings",{enabled:en}).then(function(){toast(en?"✅ Yoqildi":"⏸ To'xtatildi")})};
 $("#ucr").onclick=function(){rq=!rq;this.className="btn s "+(rq?"g":"e");this.textContent=rq?"ON":"OFF"};
 function save(){return post("/api/adm/uc/settings",{lookup_url:$("#ul1").value,lookup_path:$("#ul2").value,lookup_key:$("#ul3").value,require_nick:rq})}
 $("#ulsv").onclick=function(){var b=this;b.disabled=true;save().then(function(r){b.disabled=false;toast(r.ok?"✅ Saqlandi":"❌ "+ucErr(r))})};
 $("#ultb").onclick=function(){var o=$("#ult");o.textContent="Tekshirilmoqda…";save().then(function(s){if(!s.ok){o.textContent="❌ "+ucErr(s);return}
  post("/api/adm/uc/lookup",{pubg_id:$("#ul4").value}).then(function(r){o.textContent=!r.ok?"❌ "+ucErr(r):r.status==="found"?"✅ Nickname: "+r.nickname:r.status==="not_found"?"⚠️ O'yinchi topilmadi":"❌ Javob olinmadi ("+(r.reason||"xato")+")"})})}})}

api("/api/adm/overview").then(function(d){if(d.ok){pending=d.pending;nav()}});
render();setInterval(function(){if(tab==="orders"&&!busy&&!document.activeElement.matches("input"))orders()},20000);
})();
</script>
</body>
</html>
